<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Phantom">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="1.5" fill="#ffffff" opacity="0.5"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="200" height="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- 底色 -->
    <rect width="200" height="200" fill="#0B0B0D"/>

    <!-- 红色斜块 -->
    <g transform="skewX(-13)">
      <rect x="-70" y="0" width="52" height="240" fill="#E60012"/>
      <rect x="6"   y="0" width="26" height="240" fill="#E60012" opacity="0.55"/>
      <rect x="118" y="0" width="40" height="240" fill="#9E000C"/>
      <rect x="178" y="0" width="20" height="240" fill="#E60012" opacity="0.35"/>
    </g>

    <!-- 网点 -->
    <rect x="98" y="14" width="92" height="70" fill="url(#dots)" opacity="0.55"/>
    <rect x="10" y="128" width="86" height="62" fill="url(#dots)" opacity="0.35"/>

    <!-- 字母 P：红色错位版 + 白色正版 -->
    <g transform="translate(100 100) skewX(-10) translate(-100 -100)">
      <path fill="#0B0B0D" fill-rule="evenodd"
        d="M62 40 H110 C136 40 152 55 152 76 C152 97 136 112 110 112 H90 V164 H62 Z
           M90 64 V88 H106 C116 88 122 83 122 76 C122 69 116 64 106 64 Z"
        transform="translate(7 7)"/>
      <path fill="#FFFFFF" fill-rule="evenodd"
        d="M62 40 H110 C136 40 152 55 152 76 C152 97 136 112 110 112 H90 V164 H62 Z
           M90 64 V88 H106 C116 88 122 83 122 76 C122 69 116 64 106 64 Z"/>
    </g>

    <!-- 边框 -->
    <rect x="2.5" y="2.5" width="195" height="195" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9"/>
  </g>
</svg>
